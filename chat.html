<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雷米埃尔丹</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');

  body {
    font-family: 'Noto Sans SC', sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #000;
  }

  .bg {
    position: fixed;
    inset: 0;
    background: url('bg.jpg') center/cover no-repeat;
    filter: brightness(0.7) saturate(1.1);
  }

  .bg-overlay {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.4) 100%),
      linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.6) 100%);
  }

  .chat {
    width: 480px;
    height: 780px;
    background: rgba(10,10,18,0.55);
    backdrop-filter: blur(32px) saturate(1.2);
    -webkit-backdrop-filter: blur(32px) saturate(1.2);
    border-radius: 0;
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow: 0 24px 80px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .chat::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      rgba(255,255,255,0.02) 0%,
      transparent 30%,
      transparent 70%,
      rgba(0,0,0,0.2) 100%);
    pointer-events: none;
  }

  .header {
    padding: 20px 24px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    position: relative;
    z-index: 1;
  }

  .avatar-wrap {
    position: relative;
    flex-shrink: 0;
  }

  .avatar {
    width: 64px;
    height: 64px;
    border-radius: 0;
    overflow: hidden;
    border: 1.5px solid rgba(255,255,255,0.08);
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 6px 24px rgba(0,0,0,0.4);
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .avatar.thinking { border-color: #fbbf24; box-shadow: 0 0 36px rgba(251,191,36,0.12), 0 6px 24px rgba(0,0,0,0.4); }
  .avatar.generating { border-color: #60a5fa; box-shadow: 0 0 36px rgba(96,165,250,0.12), 0 6px 24px rgba(0,0,0,0.4); }
  .avatar.smug { border-color: #f472b6; box-shadow: 0 0 36px rgba(244,114,182,0.12), 0 6px 24px rgba(0,0,0,0.4); }

  .header-info { flex: 1; }

  .header-info h1 {
    color: #fff;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 2px;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 0;
    background: #34d399;
    display: inline-block;
    animation: pulse 2s infinite;
  }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.2} }

  .status-text {
    color: rgba(255,255,255,0.3);
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 1px;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 20px 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    position: relative;
    z-index: 1;
  }

  .messages::-webkit-scrollbar { width: 3px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); }

  .msg {
    max-width: 88%;
    padding: 12px 16px;
    font-size: 14px;
    line-height: 1.7;
    animation: msgIn 0.25s ease;
    word-break: break-word;
    position: relative;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px); }
  }

  .msg.user {
    align-self: flex-end;
    background: rgba(255,80,30,0.25);
    color: #fff;
    border: 1px solid rgba(255,80,30,0.15);
  }

  .msg.ai {
    align-self: flex-start;
    background: rgba(0,0,0,0.3);
    color: rgba(255,255,255,0.8);
    border: 1px solid rgba(255,255,255,0.04);
  }

  .msg-ai-label {
    font-size: 10px;
    color: rgba(255,255,255,0.2);
    font-weight: 500;
    margin-bottom: 6px;
    letter-spacing: 2px;
  }

  .typing {
    align-self: flex-start;
    display: flex;
    gap: 4px;
    padding: 14px 18px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.04);
  }

  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 0;
    background: rgba(255,255,255,0.15);
    animation: typingBounce 1.4s infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); background: rgba(255,255,255,0.15); }
    30% { transform: translateY(-7px); background: rgba(255,255,255,0.35); }
  }

  .input-area {
    padding: 14px 20px 20px;
    display: flex;
    gap: 10px;
    position: relative;
    z-index: 1;
    border-top: 1px solid rgba(255,255,255,0.03);
  }

  .input-area input {
    flex: 1;
    padding: 12px 16px;
    border: none;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.04);
    color: #fff;
    font-size: 14px;
    outline: none;
    font-family: inherit;
    transition: border-color 0.25s;
  }

  .input-area input::placeholder { color: rgba(255,255,255,0.1); }

  .input-area input:focus {
    border-color: rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.4);
  }

  .input-area button {
    width: 46px;
    height: 46px;
    border: none;
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.4);
    font-size: 16px;
    cursor: pointer;
    transition: all 0.25s;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255,255,255,0.04);
  }

  .input-area button:hover {
    background: rgba(255,255,255,0.1);
    color: #fff;
  }

  .input-area button:disabled {
    opacity: 0.2;
    cursor: not-allowed;
  }

  .suggestion-chips {
    display: flex;
    gap: 6px;
    padding: 2px 20px 0;
    position: relative;
    z-index: 1;
    flex-wrap: wrap;
  }

  .chip {
    padding: 5px 12px;
    background: rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.04);
    color: rgba(255,255,255,0.2);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    letter-spacing: 0.5px;
  }

  .chip:hover {
    background: rgba(255,255,255,0.04);
    border-color: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.4);
  }

  @media (max-width: 520px) {
    .chat { width: 100%; height: 100vh; border-radius: 0; }
    body { padding: 0; }
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="bg-overlay"></div>

<div class="chat">
  <div class="header">
    <div class="avatar-wrap">
      <div class="avatar" id="avatar">
        <img src="待机.webp" alt="avatar" id="avatarImg">
      </div>
    </div>
    <div class="header-info">
      <h1>雷米埃尔丹</h1>
      <div class="status-row">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">在线</span>
      </div>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="suggestion-chips" id="chips"></div>

  <div class="input-area">
    <input id="input" type="text" placeholder="说点什么..." autofocus>
    <button id="sendBtn" onclick="send()">→</button>
  </div>
</div>

<script>
  // 仅请求本地后端，API Key 保存在服务端，不暴露给浏览器
  const API_ENDPOINT = '/api/chat';

  const AVATARS = {
    idle: '待机.webp',
    idle2: '待机2.webp',
    thinking: '思考中.webp',
    generating: '生成答案.webp',
    smug: '沾沾自喜.webp'
  };

  const SUGGESTIONS = ['你好', '你是谁', '绝区零', '讲个笑话', '新艾利都最近怎样'];

  const msgs = document.getElementById('messages');
  const input = document.getElementById('input');
  const avatar = document.getElementById('avatar');
  const avatarImg = document.getElementById('avatarImg');
  const statusText = document.getElementById('statusText');
  const statusDot = document.getElementById('statusDot');
  const sendBtn = document.getElementById('sendBtn');
  const chips = document.getElementById('chips');

  let isWaiting = false;

  SUGGESTIONS.forEach(text => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = text;
    chip.onclick = () => { input.value = text; send(); };
    chips.appendChild(chip);
  });

  function setState(state) {
    avatar.className = 'avatar';
    if (state === 'thinking') {
      avatar.classList.add('thinking');
      avatarImg.src = AVATARS.thinking;
      statusText.textContent = '思考中...';
      statusDot.style.background = '#fbbf24';
    } else if (state === 'generating') {
      avatar.classList.add('generating');
      avatarImg.src = AVATARS.generating;
      statusText.textContent = '生成中...';
      statusDot.style.background = '#60a5fa';
    } else if (state === 'smug') {
      avatar.classList.add('smug');
      avatarImg.src = AVATARS.smug;
      statusText.textContent = '沾沾自喜';
      statusDot.style.background = '#f472b6';
    } else {
      avatarImg.src = Math.random() > 0.5 ? AVATARS.idle : AVATARS.idle2;
      statusText.textContent = '在线';
      statusDot.style.background = '#34d399';
    }
  }

  function addMsg(text, role) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    if (role === 'ai') {
      div.innerHTML = `<div class="msg-ai-label">雷米埃尔丹</div>${text}`;
    } else {
      div.textContent = text;
    }
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typing';
    for (let i = 0; i < 3; i++) div.appendChild(document.createElement('span'));
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  async function callAPI(userText) {
    const res = await fetch(API_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: userText })
    });

    if (!res.ok) {
      let detail = '';
      try {
        const errData = await res.json();
        detail = errData.error || '';
      } catch (e) {}
      throw new Error(detail || `请求失败 (${res.status})`);
    }

    const data = await res.json();
    return data.reply.trim();
  }

  async function send() {
    const text = input.value.trim();
    if (!text || isWaiting) return;
    input.value = '';
    isWaiting = true;
    sendBtn.disabled = true;

    addMsg(text, 'user');

    setState('thinking');
    await sleep(300 + Math.random() * 400);

    setState('generating');
    showTyping();

    try {
      const reply = await callAPI(text);
      removeTyping();

      if (/笑|哈哈|幽默|好玩|有意思|不错|可以/.test(reply) && Math.random() > 0.4) {
        setState('smug');
      } else {
        setState('idle');
      }

      addMsg(reply, 'ai');
    } catch (err) {
      removeTyping();
      setState('idle');
      addMsg(`[${err.message}]`, 'ai');
    }

    isWaiting = false;
    sendBtn.disabled = false;
    input.focus();
    setTimeout(() => { if (!isWaiting) setState('idle'); }, 4000);
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
  input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

  setTimeout(() => {
    addMsg('雷米埃尔丹。等你半天了。', 'ai');
  }, 700);
</script>
</body>
</html>
